name: tag

# Creates the tag that release.yml consumes.
#
# release.yml already does the right thing once a `v*` tag exists: it runs
# every suite, builds the wheel, and publishes SHA256SUMS beside it. What it
# has no way to know is WHEN to fire — someone has to remember to push a tag
# after bumping __version__, and a forgotten tag means a version bump that
# never ships.
#
# So this composes with it rather than replacing it: on each push to main the
# gates run on, it tags __version__ if that tag does not exist yet, and then
# STARTS release.yml by hand. That last part is not belt-and-braces: a `v*`
# tag pushed with the built-in GITHUB_TOKEN does not trigger release.yml at
# all. GitHub suppresses workflow runs from token-authored events so a
# workflow cannot loop on its own pushes, and `workflow_dispatch` is one of
# the two documented exceptions to that rule -- which is why the last step
# below dispatches rather than relying on the push.
#
# Without it the failure is silent and total: the tag lands, the version looks
# shipped, no release is ever cut, and nothing goes red. That happened to
# v1.1.0.
#
# release.yml re-runs the suites itself before publishing anything, so the
# publish path keeps its own safety net regardless of what happened here.
#
# It still waits for the other gates first. A tag is the one artefact that
# outlives a mistake — a branch can be force-pushed, but a release someone
# has pulled cannot be unpublished — so tagging a red commit is worth
# preventing even though release.yml would catch a failing suite later. It
# would NOT catch a lint or type regression, which never reach that job.

on:
  push:
    # The gates' own filter, not __init__.py alone: a push that supersedes the
    # version bump cancels the bump's gates, so the superseding commit must
    # carry the pending tag, and a push the gates ignore cancels nothing.
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to tag (default: the branch tip)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: a superseded test run teaches you nothing and is
  # worth cancelling; a superseded tag run may be midway through creating a
  # tag.
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Creating the tag. release.yml holds its own write permission for the
      # release itself.
      contents: write
      # Reading the other workflows' results for this SHA.
      checks: read
      # Dispatching release.yml. See the last step for why the tag push
      # cannot do that on its own.
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # This job DOES push (the tag), so it keeps the token.
          persist-credentials: true

      - name: Read and validate the version
        id: version
        # Read from the installed attribute rather than grepped out of the
        # file: pyproject.toml resolves the distribution version from this
        # same attribute, so reading it the same way is the only way to be
        # sure the tag and the wheel agree.
        run: |
          version="$(python3 -c 'import session_archivers; print(session_archivers.__version__)')"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._a-z0-9-]*)$'; then
            echo "__version__ is not a usable version: '$version'" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Refuse to re-tag an existing version
        id: free
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        # On a push an existing tag is the normal case: this version shipped
        # and the push did not bump it. On a dispatch it means a mistaken
        # input or a rerun after a partial failure, which wants a human.
        run: |
          if gh api -H "Cache-Control: no-cache" \
               "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "$TAG already exists; nothing to tag."
              echo "free=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG already exists — __version__ was set to a version" >&2
            echo "that has already shipped. Bump it further, or delete that" >&2
            echo "tag and its release if it was cut in error." >&2
            exit 1
          fi
          echo "$TAG is free"
          echo "free=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the other gates on this commit
        if: steps.free.outputs.free == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.job }}
        # What it checks, each a way this can be wrong:
        #   - it skips only runs named exactly as this job, or it would wait
        #     on a job waiting on it; `tag-...` names still count;
        #   - each `required` gate must report and conclude `success`, so
        #     it cannot tag before CI is scheduled, nor on a skipped gate.
        #     A matrix gate's runs are named `<job> (<legs>)`. actionlint
        #     is absent: its push trigger covers workflow files only;
        #   - every other run must end success, skipped or neutral, and it
        #     waits for every pending run. `cancelled` counts as failure: a
        #     cancelled run means a newer push superseded this SHA;
        #   - a required gate still unreported at the deadline is named.
        run: |
          required=(pycodestyle pylint pyright pip-audit analyze suites wheel coverage)
          gate_of() {
            for gate in "${required[@]}"; do
              case "$1" in "$gate" | "$gate ("*) echo "$gate"; return ;; esac
            done
          }
          deadline=$(( SECONDS + 45 * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --paginate \
              -H "Cache-Control: no-cache" \
              "repos/$REPO/commits/$SHA/check-runs" \
              --jq '.check_runs[] | "\(.status)\t\(.conclusion)\t\(.name)"')"

            declare -A seen=()
            judged="" pending="" bad=""
            while IFS=$'\t' read -r status conclusion name; do
              if [ -z "$name" ] || [ "$name" = "$SELF" ]; then continue; fi
              line="$(printf '%s\t%s\t%s' "$status" "$conclusion" "$name")"
              judged+="    $line"$'\n'
              gate="$(gate_of "$name")"
              if [ -n "$gate" ]; then seen[$gate]=1; fi
              if [ "$status" != completed ]; then
                pending+="    $line"$'\n'
              elif [ -n "$gate" ] && [ "$conclusion" != success ]; then
                bad+="    $line"$'\n'
              elif [ -z "$gate" ]; then
                case "$conclusion" in
                  success | skipped | neutral) ;;
                  *) bad+="    $line"$'\n' ;;
                esac
              fi
            done <<< "$runs"
            missing=""
            for gate in "${required[@]}"; do
              if [ -z "${seen[$gate]:-}" ]; then missing+=" $gate"; fi
            done

            if [ -n "$missing" ] || [ -n "$pending" ]; then
              if [ -n "$missing" ]; then
                echo "required gate(s) not reported yet:$missing"
              fi
              if [ -n "$pending" ]; then
                echo "check(s) still running:"
                printf '%s' "$pending"
              fi
              sleep 20
              continue
            fi

            echo "All checks completed:"
            printf '%s' "$judged"
            if [ -n "$bad" ]; then
              echo "Refusing to tag: these checks did not pass:" >&2
              printf '%s' "$bad" >&2
              exit 1
            fi
            echo "Every check passed — proceeding."
            exit 0
          done
          echo "Timed out after 45 minutes waiting for checks on $SHA" >&2
          if [ -n "$missing" ]; then
            echo "These required gates never reported:$missing" >&2
          fi
          exit 1

      - name: Create and push the tag
        if: steps.free.outputs.free == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ inputs.sha || github.sha }}
        # An annotated tag, not lightweight: it records who created it and
        # when, which a lightweight tag does not.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "$TAG"
          echo "Pushed $TAG at $SHA."
          {
            echo "### Tagged \`$TAG\`"
            echo
            echo "Commit \`$SHA\`, after every check on it passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        if: steps.free.outputs.free == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        # release.yml also triggers on `push: tags: v*`, and that trigger
        # is what fires for a tag a HUMAN pushes. It does not fire for the
        # tag the step above just pushed, because that push was
        # authenticated with GITHUB_TOKEN. Dispatching is the documented
        # way through, and it composes safely with the push trigger:
        # release.yml replaces the assets on a release that already exists
        # rather than failing, so firing twice is not a problem.
        run: |
          gh workflow run release.yml --repo "$REPO" --ref "$TAG"
          echo "Dispatched release.yml against $TAG."
          {
            echo "\`release.yml\` dispatched against \`$TAG\`; it builds"
            echo "and publishes the wheel and its checksums from there."
          } >> "$GITHUB_STEP_SUMMARY"
