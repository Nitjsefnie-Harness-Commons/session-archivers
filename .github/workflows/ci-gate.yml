name: ci gate

# One check, `aggregate`, reports on every trigger and folds the six gate
# workflows run below as legs. A docs-only change skips the legs; any other
# change, or one whose path list cannot be read, runs them all.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer head supersedes its pull request's run; no push or dispatch run
  # cancels another.
  group: ci-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        # Docs-only is the old push filter: every path is **/*.md, LICENSE or
        # .gitignore. --no-renames, so a renamed file lists its old path too.
        run: |
          from=""
          case "$EVENT_NAME" in
            pull_request) from="$BASE_SHA" ;;
            push) from="$BEFORE_SHA" ;;
          esac
          case "$from" in *[!0-9a-f]*) from="" ;; esac
          changed="$RUNNER_TEMP/changed-paths"
          docs_only=false
          if [ -n "$from" ] && git diff --no-renames --name-only -z "$from" "$HEAD_SHA" > "$changed" && [ -s "$changed" ]; then
            docs_only=true
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md | LICENSE | .gitignore) ;;
                *) docs_only=false; echo "not documentation: $path"; break ;;
              esac
            done < "$changed"
          else
            echo "no change list for $EVENT_NAME from '$from': every leg runs"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  tests:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read

  lint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  types:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: $/.github/workflows/types.yml
    permissions:
      contents: read

  audit:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: $/.github/workflows/audit.yml
    permissions:
      contents: read

  codeql:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: $/.github/workflows/codeql.yml
    permissions:
      security-events: write
      actions: read
      contents: read

  actionlint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: $/.github/workflows/actionlint.yml
    permissions:
      contents: read

  diff-coverage:
    # Information only, so not in aggregate's needs; see the script's docstring.
    needs: tests
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.tests.result == 'success' || needs.tests.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A pattern, not a name: no match downloads nothing and passes.
          pattern: coverage-xml
          path: ${{ runner.temp }}/coverage-xml

      - name: Report the coverage of the lines this pull request adds
        env:
          SESSION_ARCHIVERS_TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          artifact="$RUNNER_TEMP/coverage-xml"
          if [ ! -d "$artifact" ] || [ -z "$(ls -A "$artifact")" ]; then
            if [ "$SESSION_ARCHIVERS_TESTS_RESULT" = success ]; then
              echo "The tests leg succeeded, so it uploaded coverage-xml, yet this run holds none." >&2
              exit 1
            fi
            echo "The tests leg uploaded no coverage XML, so there is no patch coverage to report." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c core.quotePath=false diff --text --no-ext-diff --no-textconv --find-renames --unified=0 HEAD^1 HEAD > "$RUNNER_TEMP/patch.diff"
          python3 .github/scripts/diff_coverage.py --coverage "$artifact/coverage.xml" --diff "$RUNNER_TEMP/patch.diff" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    needs: [classify, tests, lint, types, audit, codeql, actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check no tracked file carries a merge-conflict marker
        run: |
          # git grep exits 1 for no match and above 1 when it could not run;
          # reading that error as a clean tree would be a false green.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Require the head to carry main's gate-defining commits
        # Sees main as of this run; CONTRIBUTING says what it cannot.
        if: github.event_name == 'pull_request'
        env:
          SESSION_ARCHIVERS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/gate_base_freshness.py

      - name: Refuse a workflow-name scope outside the ci type
        if: github.event_name == 'pull_request'
        env:
          SESSION_ARCHIVERS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/commit_scopes.py

      - name: Self-test the patch coverage reporter
        run: python3 .github/scripts/diff_coverage.py --self-test

      - name: Self-test the coverage floor ratchet
        run: python3 .github/scripts/ratchet_thresholds.py --self-test

      - name: Self-test the commit scope check
        run: python3 .github/scripts/commit_scopes.py --self-test

      - name: Self-test the fold
        run: python3 .github/scripts/aggregate_gate.py --self-test

      - name: Fold the leg results into one verdict
        env:
          SESSION_ARCHIVERS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/aggregate_gate.py
