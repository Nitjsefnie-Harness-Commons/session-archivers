name: release

# Publishes the wheel a consumer installs. The checksum file is not optional
# decoration: an installer that fetches "the newest release" has no other way
# to prove it got the artifact this workflow built, so SHA256SUMS ships beside
# the wheel and the installer verifies against it before installing.
#
# Two jobs, so that nothing holding a write token runs this repository's code
# or installs a package: `build` does all of that read-only and hands over an
# artifact; `publish` only checks, attests and uploads those bytes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace the assets of a release that already has them'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the build backend
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Install the package and its declared dependencies
        # For the SUITES below, not for the build: they import the package,
        # which imports boto3, and without this every one of them dies at
        # collection with ModuleNotFoundError. This step was dropped as
        # collateral in e042a99 (a commit about pinning actions), on the
        # since-falsified premise that the suite "deliberately never imports
        # the code it checks" — test_package_contract.py has always imported
        # it, to prove importing demands no credentials. Nothing caught the
        # regression because the tag that would have run this workflow was
        # pushed with GITHUB_TOKEN, which does not trigger workflows, so
        # release.yml did not run at all between then and v1.1.0.
        run: pip install .

      - name: Run every suite before publishing anything
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

      - name: Build the wheel
        # The wheel records each file's date and permission bits. The dates
        # come from SOURCE_DATE_EPOCH, the tagged commit's own time; the
        # bits of tracked files are set to git's (644, 755 if executable)
        # whatever umask made the checkout; everything the build generates
        # gets umask 022, after the rm drops the build/ and egg-info that
        # `pip install .` left under its own umask, which setuptools would
        # reuse; pyproject.toml pins the backend. So these commands, run on
        # a checkout of the tag with Python 3.13, reproduce the published hash.
        run: |
          rm -rf -- build session_archivers.egg-info
          umask 022
          git ls-files -z | xargs -0 chmod a+rX,go-w --
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m build --wheel

      - name: Publish checksums beside the wheel
        working-directory: dist
        # `--` so a wheel whose name starts with a dash cannot be read as
        # an option (shellcheck SC2035).
        run: sha256sum -- *.whl > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Both for the provenance attestation: a Sigstore certificate is
      # issued against the job's OIDC token.
      id-token: write
      attestations: write

    steps:
      - name: Refuse a ref that is not a tag
        id: tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Not a tag ref ($GITHUB_REF); nothing to publish." >&2
              echo "Push a v* tag — .github/workflows/tag.yml does that" >&2
              echo "automatically when __version__ changes." >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check the wheel against the checksums built with it
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Decide how to publish, or refuse
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPLACE: ${{ inputs.replace }}
        # Every refusal fires here, before the attestation below records a
        # wheel this run would then not publish.
        #
        # A release with assets is refused unless `replace` is set: assets
        # once published are what consumers already verified. A published
        # immutable release takes no new or replaced asset and its tag can
        # never be reused, so it is refused outright. `gh release create`
        # drafts, uploads, then publishes, so an interrupted create leaves a
        # draft, which gets its assets and is then published.
        run: |
          error="$RUNNER_TEMP/release-view.err"
          if ! found="$(gh release view "$TAG" \
              --json isDraft,isImmutable,assets \
              --jq '"\(.isDraft) \(.isImmutable) \(.assets | length)"' 2>"$error")"; then
            if [ "$(cat "$error")" != "release not found" ]; then
              echo "Could not read release $TAG:" >&2
              cat "$error" >&2
              exit 1
            fi
            echo "action=create" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r draft immutable assets <<< "$found"
          if [ "$assets" != 0 ] && [ "$REPLACE" != true ]; then
            echo "Release $TAG already has $assets asset(s); not replacing them." >&2
            echo "Dispatch release.yml against $TAG with replace: true to" >&2
            echo "replace them; a published immutable release refuses even that." >&2
            exit 1
          fi
          if [ "$draft" = false ] && [ "$immutable" = true ]; then
            echo "Release $TAG is published and immutable: GitHub takes no new" >&2
            echo "or replaced asset on it, and its tag cannot be reused." >&2
            echo "Release the next version instead." >&2
            exit 1
          fi
          if [ "$assets" = 0 ]; then
            echo "action=upload" >> "$GITHUB_OUTPUT"
          else
            echo "action=clobber" >> "$GITHUB_OUTPUT"
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Attach the wheel and its checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          ACTION: ${{ steps.plan.outputs.action }}
          DRAFT: ${{ steps.plan.outputs.draft }}
        # `gh`, not a third-party action: it is preinstalled and maintained
        # by GitHub, and this job holds contents: write.
        run: |
          case "$ACTION" in
            create)
              gh release create "$TAG" --title "$TAG" --generate-notes \
                dist/*.whl dist/SHA256SUMS ;;
            upload) gh release upload "$TAG" dist/*.whl dist/SHA256SUMS ;;
            clobber)
              echo "Release $TAG has assets; replacing them, as asked."
              gh release upload "$TAG" dist/*.whl dist/SHA256SUMS --clobber ;;
            *)
              echo "No publishing action decided for $TAG ('$ACTION')." >&2
              exit 1 ;;
          esac
          if [ "$DRAFT" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
          echo "Published $TAG."
