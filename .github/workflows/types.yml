name: types

# pyright over the shipped package. The suites are excluded in
# pyrightconfig.json: they load their target by path and reach into module
# internals on purpose, which a type checker can only ever call an error.
#
# pythonPlatform is "All" rather than the runner's: these parsers read
# Windows-spelled paths on a Linux box and vice versa, and the branches for
# each are guarded at runtime, not by the platform the check happens to run on.
#
# The one runtime dependency, boto3, installs with `.` below.

on:
  # Until the ruleset requires `aggregate`: the required pyright check
  # comes only from this run.
  pull_request:
  workflow_call:
  workflow_dispatch:

# Least privilege: this job only reads the tree.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'types' && format('types-{0}', github.ref) || format('types-called-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the type checker
        run: |
          pip install --require-hashes -r requirements-dev.txt
          # `.` too: the linters resolve boto3 imports from the installed package.
          pip install .

      - name: pyright
        run: pyright
