name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the
# Security tab rather than turning the build red, so a new query shipping
# upstream cannot block an unrelated push.
#
# ci gate runs it on pushes to main and pull requests. Each run checks out
# the event's own commit (the merge commit, on a pull request) and `analyze`
# uploads its SARIF against that same ref and SHA, so alerts always describe
# the tree that was analysed.
#
# The weekly cron is not redundant with push: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without the cron, a rule published today
# would never be applied to a file last touched last year.

on:
  # Only for the required bare analyze checks (a ci gate leg reports
  # `codeql / analyze (python)`); goes once the ruleset requires `aggregate`.
  pull_request:
  workflow_call:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow == 'codeql' && format('codeql-{0}', github.ref) || format('codeql-called-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # `actions` for the workflows, two of which hold `contents: write`;
      # `python` for the package. The repo has no JS at all. matrix.language
      # feeds the job name, `languages:` and `category:`, so each entry lands
      # as its own check.
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here: CodeQL must analyse exactly the commit it will
          # file alerts against, which is the event's own SHA.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: the Python
          # reads untrusted transcript and config files and builds paths from
          # them, and the workflows run with a repository token; the extra
          # precision-medium queries are good at both.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
