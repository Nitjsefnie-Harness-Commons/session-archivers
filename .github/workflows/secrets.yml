name: secrets

on:
  push:
    # No paths filter (siblings ignore **/*.md): a secret in any file must be scanned.
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event: daily run never cancels a push scan.
  group: secrets-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            --retry 8 --retry-all-errors --retry-max-time 300 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Take the scan's config and ignore list from the trusted commit
        # Read from the judged tree, they would let a change exempt its own finding.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SCANNED_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) trusted="$BASE_SHA" ;;
            push) trusted="$BEFORE_SHA" ;;
            *) trusted="$SCANNED_SHA" ;;
          esac
          # An empty name would read the index, the judged tree.
          read_trusted() {
            case "$trusted" in '' | *[!0-9a-f]*) return 1 ;; esac
            git cat-file blob "$trusted:$1"
          }
          dir="$RUNNER_TEMP/gitleaks-trusted"
          mkdir "$dir"
          if ! read_trusted .gitleaks.toml > "$dir/.gitleaks.toml"; then
            echo "no .gitleaks.toml at trusted commit '$trusted': default rules"
            printf '[extend]\nuseDefault = true\n' > "$dir/.gitleaks.toml"
          fi
          if ! read_trusted .gitleaksignore > "$dir/.gitleaksignore"; then
            echo "no .gitleaksignore at trusted commit '$trusted': nothing ignored"
          fi
          python3 -I - "$dir/.gitleaks.toml" <<'PY'
          import sys
          import tomllib

          def keys(table, prefix=""):
              for key, value in table.items():
                  name = prefix + key.lower()
                  yield name, value
                  if isinstance(value, dict):
                      yield from keys(value, name + ".")

          with open(sys.argv[1], "rb") as config:
              if any(n == "extend.path" and v != "" for n, v in keys(tomllib.load(config))):
                  sys.exit("trusted .gitleaks.toml sets [extend] path, which gitleaks "
                           "resolves inside the judged checkout: refusing to scan")
          PY

      - name: Scan the tree and the history
        # Bare: exit status is the gate; `|| true`/continue-on-error would un-gate it.
        # The tree's .gitleaksignore, diff attributes and gitleaks:allow are its own exemptions.
        run: |
          rm -rf .gitleaksignore
          echo '* !diff' > .git/info/attributes
          ./gitleaks detect --verbose --redact --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted"
