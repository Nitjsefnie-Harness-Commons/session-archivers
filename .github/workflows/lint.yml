name: lint

# Two gates, one job each so a failure says which tool found it.
#
# Style opinions stay off (max-line-length = 10000 in setup.cfg, and .pylintrc
# disables the formatting and metric checks): these exist for real defects, not
# formatting preferences. Every disable in .pylintrc names the pattern it is
# there for.

on:
  # Until the ruleset requires `aggregate`: the required pylint and
  # pycodestyle checks come only from this run.
  pull_request:
  workflow_call:
  workflow_dispatch:

# Least privilege: both jobs only read the tree.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'lint' && format('lint-{0}', github.ref) || format('lint-called-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: |
          pip install --require-hashes -r requirements-dev.txt
          # `.` too: the linters resolve boto3 imports from the installed package.
          pip install .

      - name: pycodestyle
        run: git ls-files '*.py' | xargs pycodestyle

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: |
          pip install --require-hashes -r requirements-dev.txt
          # `.` too: the linters resolve boto3 imports from the installed package.
          pip install .

      - name: pylint
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc
