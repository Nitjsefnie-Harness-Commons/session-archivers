# Every tool a requirements file names is pinned to an exact version:
# a tool release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to audit.yml, which detects the problem but cannot fix it.
#
# There is no npm entry: this repo has no JavaScript at all.

version: 2
updates:
  # Every requirements*.txt at the root: requirements-dev.txt (lint/type
  # toolchain), requirements-test.txt (coverage), requirements-build.txt
  # (the wheel build), requirements-zizmor.txt and requirements-pip-audit.txt
  # (the two gates installed from manifests because Dependabot reads no
  # `run:` block). The hashed ones are rewritten with their hashes. The
  # package and boto3 are declared in pyproject.toml and are not pinned here:
  # the distributed package is stdlib-only on purpose besides boto3.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Grouped so codeql-action's `init` and `analyze`, which must share one
    # version or `analyze` fails, bump in a single pull request. A group
    # covers version updates only unless it names `applies-to`, so security
    # updates, which are enabled here, get a group of their own.
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
