name: release

# Publishes the wheel a consumer installs. The checksum file is not optional
# decoration: an installer that fetches "the newest release" has no other way
# to prove it got the artifact this workflow built, so SHA256SUMS ships beside
# the wheel and the installer verifies against it before installing.
#
# Two jobs, so that nothing holding a write token runs this repository's code
# or installs a package: `build` does all of that read-only and hands over an
# artifact; `publish` only checks and uploads those bytes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the build backend
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Install the package and its declared dependencies
        # For the SUITES below, not for the build: they import the package,
        # which imports boto3, and without this every one of them dies at
        # collection with ModuleNotFoundError. This step was dropped as
        # collateral in e042a99 (a commit about pinning actions), on the
        # since-falsified premise that the suite "deliberately never imports
        # the code it checks" — test_package_contract.py has always imported
        # it, to prove importing demands no credentials. Nothing caught the
        # regression because the tag that would have run this workflow was
        # pushed with GITHUB_TOKEN, which does not trigger workflows, so
        # release.yml did not run at all between then and v1.1.0.
        run: pip install .

      - name: Run every suite before publishing anything
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

      - name: Build the wheel
        run: python -m build --wheel

      - name: Publish checksums beside the wheel
        working-directory: dist
        # `--` so a wheel whose name starts with a dash cannot be read as
        # an option (shellcheck SC2035).
        run: sha256sum -- *.whl > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Refuse a ref that is not a tag
        id: tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Not a tag ref ($GITHUB_REF); nothing to publish." >&2
              echo "Push a v* tag — .github/workflows/tag.yml does that" >&2
              echo "automatically when __version__ changes." >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check the wheel against the checksums built with it
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attach the wheel and its checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        # `gh`, not a third-party action: it is preinstalled and maintained
        # by GitHub, and this job holds contents: write.
        #
        # Both branches exist because the two triggers differ: a tag push
        # creates the release, while a workflow_dispatch rerun finds it
        # already there and must replace the assets rather than fail.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" dist/*.whl dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              dist/*.whl dist/SHA256SUMS
          fi
          echo "Published $TAG."
